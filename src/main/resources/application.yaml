spring:
  profiles:
    active:
      - local
  application:
    name : spring-boot-essentials-jpa
  datasource:
      url: jdbc:postgresql://localhost:5432/
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jwt:
    expiration: ${JWT_EXPIRATION}
    key: ${JWT_KEY}





